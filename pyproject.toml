[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "kv-cache-sim"
version = "0.1.0"
description = "Offline KV cache eviction simulation platform for prefix cache hit-rate analysis"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
]
io = [
    "pandas>=1.5",
]
plot = [
    "matplotlib>=3.5",
    "numpy>=1.22",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["sim*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.coverage.run]
source = ["sim"]
omit = ["tests/*", "scripts/*"]
